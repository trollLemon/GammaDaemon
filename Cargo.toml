[workspace]
members = [
    "lib",
    "cli",
    "daemon"
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/trollLemon/GammaDaemon"
documentation = "https://github.com/trollLemon/GammaDaemon"
homepage = "https://github.com/trollLemon/GammaDaemon"

[workspace.dependencies]
battery = { git = "https://github.com/trollLemon/rust-battery" }
clap = "4.5.58"
serde = {version = "1.0.188", features = ["derive"]}
toml = "0.8"
serde_json = "1.0.149"

[profile.release]
opt-level = "z"
strip = true
lto = true
debug-assertions = false
debug = 0
overflow-checks = false
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
